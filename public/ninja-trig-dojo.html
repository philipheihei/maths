<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忍者貓的三角道場 - 對邊、鄰邊、斜邊</title>
    <!-- 引入 Tailwind CSS 進行快速美美的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .pop {
            animation: pop 0.3s ease-in-out;
        }
        /* 線條 hover 特效 */
        .edge-line {
            transition: all 0.2s;
        }
        .edge-hitbox:hover + .edge-line,
        .edge-hitbox:hover ~ .edge-line {
            stroke: #FBBF24; /* Tailwind yellow-400 */
            stroke-width: 8;
            filter: drop-shadow(0 0 8px #FBBF24);
        }
        .correct-flash-hypotenuse {
            stroke: #A855F7 !important;
            stroke-width: 10 !important;
            filter: drop-shadow(0 0 12px #A855F7) !important;
        }
        .correct-flash-opposite {
            stroke: #3B82F6 !important;
            stroke-width: 10 !important;
            filter: drop-shadow(0 0 12px #3B82F6) !important;
        }
        .correct-flash-adjacent {
            stroke: #EC4899 !important;
            stroke-width: 10 !important;
            filter: drop-shadow(0 0 12px #EC4899) !important;
        }
        .wrong-flash {
            stroke: #F87171 !important; /* Tailwind red-400 */
            stroke-width: 10 !important;
        }
        
        /* 新增：視覺化回饋的淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in-element {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 背景裝飾動畫 */
        body {
            background: linear-gradient(160deg, #080118 0%, #150828 30%, #0d1540 65%, #070d2a 100%);
        }
        @keyframes bgFloat1 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-22px) rotate(180deg); }
        }
        @keyframes bgFloat2 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(-180deg); }
        }
        @keyframes bgFloat3 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-28px) scale(1.15); }
        }
        @keyframes bgTwinkle {
            0%, 100% { opacity: 0.12; transform: scale(0.85); }
            50% { opacity: 0.55; transform: scale(1.25); }
        }
        @keyframes bgFall {
            0%   { transform: translateY(-10px) rotate(0deg); opacity: 0.5; }
            100% { transform: translateY(30px) rotate(60deg); opacity: 0.1; }
        }

        /* 隱藏原生點擊高亮 */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== iPad 橫式排版 ===== */
        @media (orientation: landscape) and (min-width: 768px) {
            body { align-items: center; }

            #mainCard {
                max-width: 980px !important;
                height: min(calc(100vh - 2rem), 680px);
                display: grid !important;
                grid-template-columns: 300px 1fr;
                grid-template-rows: auto 1fr auto;
            }
            #topBar {
                grid-column: 1; grid-row: 1;
                border-right: 2px solid #334155;
            }
            #questionArea {
                grid-column: 1; grid-row: 2;
                border-right: 2px solid #334155;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            #legendArea {
                grid-column: 1; grid-row: 3;
                border-right: 2px solid #334155;
            }
            #gameContainer {
                grid-column: 2; grid-row: 1 / 4;
                width: 100%;
                height: 100%;
                aspect-ratio: unset !important;
            }
        }
    </style>
</head>
<body class="text-white font-sans min-h-screen flex items-center justify-center p-4">

    <!-- 背景裝飾層：忍者道場主題 -->
    <div style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0">
        <!-- 大型場景道具 -->
        <span style="position:absolute;top:3%;right:7%;font-size:48px;opacity:0.5;animation:bgTwinkle 9s ease-in-out infinite">🌙</span>
        <span style="position:absolute;bottom:1%;left:2%;font-size:64px;opacity:0.1">⛩️</span>
        <span style="position:absolute;bottom:1%;right:1%;font-size:56px;opacity:0.09">🏯</span>
        <!-- 飄落的櫻花 -->
        <span style="position:absolute;top:18%;left:8%;font-size:18px;opacity:0.3;animation:bgFall 4s ease-in-out infinite alternate">🌸</span>
        <span style="position:absolute;top:28%;right:7%;font-size:14px;opacity:0.25;animation:bgFall 5.5s ease-in-out infinite alternate 1s">🌸</span>
        <span style="position:absolute;top:60%;left:4%;font-size:16px;opacity:0.2;animation:bgFall 6s ease-in-out infinite alternate 2s">🌸</span>
        <!-- 旋轉飛鏢 -->
        <span style="position:absolute;top:7%;left:5%;font-size:26px;color:#a855f7;opacity:0.32;animation:bgFloat1 5s ease-in-out infinite">✦</span>
        <span style="position:absolute;top:12%;right:4%;font-size:20px;color:#3b82f6;opacity:0.28;animation:bgFloat2 6s ease-in-out infinite 1s">✦</span>
        <span style="position:absolute;top:38%;left:2%;font-size:18px;color:#ec4899;opacity:0.28;animation:bgFloat1 7s ease-in-out infinite 2s">✦</span>
        <span style="position:absolute;top:55%;right:2%;font-size:20px;color:#a855f7;opacity:0.22;animation:bgFloat2 5.5s ease-in-out infinite 0.5s">✦</span>
        <span style="position:absolute;top:74%;left:3%;font-size:16px;color:#fbbf24;opacity:0.28;animation:bgFloat3 6.5s ease-in-out infinite 1.5s">✦</span>
        <span style="position:absolute;top:80%;right:4%;font-size:22px;color:#818cf8;opacity:0.22;animation:bgFloat1 4.5s ease-in-out infinite 3s">✦</span>
        <!-- 浮動三角形（配合遊戲主題） -->
        <span style="position:absolute;top:22%;left:5%;font-size:28px;color:#6366f1;opacity:0.16;animation:bgFloat2 8s ease-in-out infinite">△</span>
        <span style="position:absolute;top:48%;right:4%;font-size:24px;color:#8b5cf6;opacity:0.16;animation:bgFloat3 9s ease-in-out infinite 2s">△</span>
        <span style="position:absolute;top:68%;left:5%;font-size:20px;color:#a78bfa;opacity:0.14;animation:bgFloat1 7s ease-in-out infinite 4s">△</span>
        <!-- 閃爍星點 -->
        <span style="position:absolute;top:5%;left:28%;font-size:14px;color:#fbbf24;opacity:0.4;animation:bgTwinkle 3.5s ease-in-out infinite">★</span>
        <span style="position:absolute;top:2%;right:24%;font-size:10px;color:#fbbf24;opacity:0.35;animation:bgTwinkle 4s ease-in-out infinite 1s">★</span>
        <span style="position:absolute;top:7%;left:52%;font-size:12px;color:#fbbf24;opacity:0.3;animation:bgTwinkle 2.8s ease-in-out infinite 0.5s">★</span>
        <span style="position:absolute;top:1%;right:42%;font-size:8px;color:#c4b5fd;opacity:0.5;animation:bgTwinkle 3s ease-in-out infinite 2s">✦</span>
        <span style="position:absolute;top:15%;left:17%;font-size:8px;color:#c4b5fd;opacity:0.4;animation:bgTwinkle 5s ease-in-out infinite 1.5s">✦</span>
        <span style="position:absolute;top:10%;right:16%;font-size:8px;color:#c4b5fd;opacity:0.35;animation:bgTwinkle 4.5s ease-in-out infinite 0.8s">✦</span>
    </div>

    <div class="max-w-md md:max-w-xl w-full bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border-4 border-slate-700" style="position:relative;z-index:1">
        <!-- 頂部資訊列 -->
        <div id="topBar" class="bg-slate-900 p-4 flex justify-between items-center border-b-2 border-slate-700">
            <div class="text-xl font-bold text-emerald-400">分數: <span id="scoreDisplay">0</span></div>
            <div class="flex items-center gap-3">
                <div class="text-lg font-bold text-purple-400">第 <span id="levelDisplay">1</span> / 10 關</div>
                <div class="text-xs font-bold text-yellow-400 bg-slate-800 px-2 py-1 rounded-full" id="phaseDisplay">🔰基礎</div>
            </div>
        </div>

        <!-- 任務提示區 -->
        <div id="questionArea" class="p-6 text-center">
            <h2 class="text-2xl font-black mb-2 tracking-wide" id="taskQuestion">準備開始！</h2>
            <p class="text-slate-400 text-sm min-h-[2.5rem]" id="feedbackMsg">點擊下方的開始按鈕</p>
        </div>

        <!-- 遊戲互動區 (SVG) -->
        <div class="relative w-full aspect-square bg-slate-800 flex justify-center items-center" id="gameContainer">
            <svg id="gameSvg" viewBox="0 0 400 400" class="w-full h-full transform transition-transform duration-700 ease-in-out">
                <!-- 定義箭頭標記 -->
                <defs>
                    <marker id="arrow-hypotenuse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7" />
                    </marker>
                    <marker id="arrow-opposite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6" />
                    </marker>
                </defs>
                <!-- 場景背景裝飾層 (固定位置，不隨三角形旋轉) -->
                <g id="sceneBg" style="pointer-events:none">
                    <!-- 月亮 -->
                    <circle cx="355" cy="45" r="28" fill="#fef3c7" opacity="0.07"/>
                    <circle cx="362" cy="40" r="23" fill="#0f172a" opacity="0.55"/>
                    <!-- 月亮光暈 -->
                    <circle cx="355" cy="45" r="36" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.09"/>
                    <!-- 遠山剪影 -->
                    <polygon points="0,400 80,260 160,340 220,200 300,310 370,230 400,280 400,400" fill="#1e293b" opacity="0.55"/>
                    <polygon points="0,400 60,310 120,370 180,280 260,340 340,265 400,310 400,400" fill="#0f172a" opacity="0.6"/>
                    <!-- 竹子：左側 -->
                    <line x1="18" y1="400" x2="18" y2="80" stroke="#166534" stroke-width="5" opacity="0.18"/>
                    <line x1="28" y1="400" x2="28" y2="110" stroke="#166534" stroke-width="4" opacity="0.13"/>
                    <line x1="10" y1="400" x2="10" y2="140" stroke="#166534" stroke-width="3" opacity="0.10"/>
                    <!-- 竹節 -->
                    <line x1="14" y1="170" x2="22" y2="170" stroke="#166534" stroke-width="3" opacity="0.2"/>
                    <line x1="14" y1="230" x2="22" y2="230" stroke="#166534" stroke-width="3" opacity="0.2"/>
                    <line x1="14" y1="290" x2="22" y2="290" stroke="#166534" stroke-width="3" opacity="0.2"/>
                    <line x1="14" y1="350" x2="22" y2="350" stroke="#166534" stroke-width="3" opacity="0.2"/>
                    <line x1="24" y1="200" x2="32" y2="200" stroke="#166534" stroke-width="2" opacity="0.15"/>
                    <line x1="24" y1="270" x2="32" y2="270" stroke="#166534" stroke-width="2" opacity="0.15"/>
                    <line x1="24" y1="340" x2="32" y2="340" stroke="#166534" stroke-width="2" opacity="0.15"/>
                    <!-- 竹葉 -->
                    <ellipse cx="18" cy="95" rx="14" ry="5" fill="#166534" opacity="0.2" transform="rotate(-30,18,95)"/>
                    <ellipse cx="28" cy="120" rx="12" ry="4" fill="#166534" opacity="0.15" transform="rotate(20,28,120)"/>
                    <!-- 右側鳥居 -->
                    <rect x="350" y="295" width="5" height="90" fill="#991b1b" opacity="0.15"/>
                    <rect x="370" y="295" width="5" height="90" fill="#991b1b" opacity="0.15"/>
                    <rect x="342" y="300" width="41" height="6" rx="2" fill="#991b1b" opacity="0.18"/>
                    <rect x="346" y="310" width="33" height="4" rx="1" fill="#991b1b" opacity="0.13"/>
                    <!-- 飄落的星點 -->
                    <circle cx="340" cy="80" r="1.5" fill="#fbbf24" opacity="0.35"/>
                    <circle cx="310" cy="55" r="1" fill="#fbbf24" opacity="0.28"/>
                    <circle cx="375" cy="100" r="1" fill="#c4b5fd" opacity="0.3"/>
                    <circle cx="80" cy="50" r="1.5" fill="#fbbf24" opacity="0.25"/>
                    <circle cx="120" cy="30" r="1" fill="#c4b5fd" opacity="0.3"/>
                    <circle cx="290" cy="35" r="1.5" fill="#fbbf24" opacity="0.28"/>
                    <!-- 地面格子紋路 -->
                    <line x1="0" y1="390" x2="400" y2="390" stroke="#334155" stroke-width="1" opacity="0.3"/>
                    <line x1="0" y1="395" x2="400" y2="395" stroke="#334155" stroke-width="0.5" opacity="0.2"/>
                </g>

                <!-- 我們將把三角形的中心放在 (200, 200) 以便旋轉 -->
                <g id="triangleGroup" transform="translate(200, 200)">
                    <!-- 三角形本體填充 (移至底層) -->
                    <polygon id="triFill" points="-50,-50 110,-50 -50,70" fill="#1E293B" class="transition-all duration-500" />
                    
                    <!-- 直角標記 (移至填充上層，並改為醒目的顏色與方形) -->
                    <path id="rightAngle" d="M -50 -20 L -20 -20 L -20 -50" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linejoin="miter" />
                    
                    <!-- 標記參考角 (扇形 Arc) -->
                    <path id="arcB" d="M 110 -50 L 70 -50 A 40 40 0 0 0 78 -26 Z" fill="#FBBF24" opacity="0.8" style="display: none;" />
                    <path id="arcC" d="M -50 70 L -50 30 A 40 40 0 0 1 -18 46 Z" fill="#FBBF24" opacity="0.8" style="display: none;" />
                    
                    <!-- 感應區 (Hitbox) - 較粗的透明線條，方便手機點擊 -->
                    <!-- AB線 (直角邊1) -->
                    <line id="hit-AB" x1="-50" y1="-50" x2="110" y2="-50" stroke="transparent" stroke-width="40" class="edge-hitbox cursor-pointer" onclick="checkAnswer('AB')" />
                    <!-- AC線 (直角邊2) -->
                    <line id="hit-AC" x1="-50" y1="-50" x2="-50" y2="70" stroke="transparent" stroke-width="40" class="edge-hitbox cursor-pointer" onclick="checkAnswer('AC')" />
                    <!-- BC線 (斜邊) -->
                    <line id="hit-BC" x1="110" y1="-50" x2="-50" y2="70" stroke="transparent" stroke-width="40" class="edge-hitbox cursor-pointer" onclick="checkAnswer('BC')" />

                    <!-- 視覺線條 (顯示給玩家看的) -->
                    <line id="line-AB" x1="-50" y1="-50" x2="110" y2="-50" stroke="#CBD5E1" stroke-width="4" class="edge-line pointer-events-none stroke-linecap-round" />
                    <line id="line-AC" x1="-50" y1="-50" x2="-50" y2="70" stroke="#CBD5E1" stroke-width="4" class="edge-line pointer-events-none stroke-linecap-round" />
                    <line id="line-BC" x1="110" y1="-50" x2="-50" y2="70" stroke="#CBD5E1" stroke-width="4" class="edge-line pointer-events-none stroke-linecap-round" />

                    <!-- 頂點標籤 -->
                    <text id="label-A" x="0" y="0" font-size="18" font-weight="900" fill="#38BDF8" text-anchor="middle" dominant-baseline="central" class="pointer-events-none">A</text>
                    <text id="label-B" x="0" y="0" font-size="18" font-weight="900" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" class="pointer-events-none">B</text>
                    <text id="label-C" x="0" y="0" font-size="18" font-weight="900" fill="#94A3B8" text-anchor="middle" dominant-baseline="central" class="pointer-events-none">C</text>

                    <!-- 頂點點擊感應區 (供玩家自由切換貓咪位置) -->
                    <circle id="hit-vertex-B" cx="0" cy="0" r="35" fill="transparent" class="cursor-pointer hover:fill-yellow-400/20 transition-colors" onclick="moveCat('B', true)" />
                    <circle id="hit-vertex-C" cx="0" cy="0" r="35" fill="transparent" class="cursor-pointer hover:fill-yellow-400/20 transition-colors" onclick="moveCat('C', true)" />

                    <!-- 新增：視覺回饋層 (放在貓咪下方，線條上方) -->
                    <g id="feedbackLayer" class="pointer-events-none"></g>

                    <!-- 忍者貓 (縮小尺寸並優化定位點) -->
                    <text id="ninjaCat" x="0" y="0" font-size="32" text-anchor="middle" dominant-baseline="central" class="pointer-events-none filter drop-shadow-lg transition-all duration-500">🐱</text>
                </g>
            </svg>
            
            <!-- 遊戲開始/遮罩層 -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center backdrop-blur-sm z-10 px-6">
                <div class="text-6xl mb-4">🐱</div>
                <h1 class="text-3xl font-black text-white mb-6 text-center">忍者貓的三角道場</h1>
                <!-- 新增故事情節 -->
                <div class="text-slate-300 mb-8 max-w-sm text-center space-y-3">
                    <p>傳說中，邪惡的幾何怪獸入侵了村莊！</p>
                    <p>忍者貓必須在三角道場中鍛鍊方位感，才能準確發射飛鏢擊退敵人。</p>
                    <p class="text-yellow-400 font-bold mt-4">切換視角，找出相對應的邊界牆壁吧！</p>
                </div>
                <button onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transform transition hover:scale-105">
                    開始修行
                </button>
            </div>

            <!-- 遊戲結束/結算層 -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-slate-900/95 hidden flex-col items-center justify-center backdrop-blur-md z-20">
                <div class="text-7xl mb-4">🏆</div>
                <h1 class="text-4xl font-black text-yellow-400 mb-2">修行完成！</h1>
                <p class="text-xl text-white mb-4">總得分: <span id="finalScore" class="text-emerald-400 font-bold text-3xl"></span></p>
                <div id="statsDisplay" class="w-full max-w-xs mb-6"></div>
                <button onclick="startGame()" class="bg-purple-500 hover:bg-purple-400 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transform transition hover:scale-105">
                    再次挑戰
                </button>
            </div>
        </div>

        <!-- 底部圖例與說明 -->
        <div id="legendArea" class="bg-slate-900 p-4 border-t-2 border-slate-700">
            <div class="flex justify-around text-sm text-slate-300">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-500"></span> 斜邊: 最長的邊</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span> 對邊: 貓對面的邊</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-pink-500"></span> 鄰邊: 貓咪和直角中間的牆</div>
            </div>
        </div>
    </div>

    <script>
        // 遊戲狀態
        let score = 0;
        let level = 1;
        const MAX_LEVEL = 10;
        let currentTarget = ''; // 'hypotenuse' (斜邊), 'opposite' (對邊), 'adjacent' (鄰邊)
        let catPosName = ''; // 'B' 或 'C' (A是直角)
        let isAnimating = false;
        let hasWronged = false; // 本關是否已答錯過
        let isTwistPhase = false; // 是否進入突發視角切換環節

        // 全域追蹤旋轉與翻轉，以便修正文字方向
        let currentRotation = 0;
        let currentFlip = 1;
        
        // 全域紀錄貓咪實際位置 (供飛鏢動畫使用)
        let catX = 0;
        let catY = 0;
        // 紀錄貓咪當前內部追蹤的頂點名稱，避免因為被動畫 transform 覆蓋導致 catPosName 判斷錯誤
        let activeVertex = '';

        // 學習統計
        let stats = { hypotenuse: 0, opposite: 0, adjacent: 0 };
        let statTotal = { hypotenuse: 0, opposite: 0, adjacent: 0 };

        // 座標定義
        let ptA = { x: 0, y: 0 }; 
        let ptB = { x: 0, y: 0 }; 
        let ptC = { x: 0, y: 0 };  
        let triW = 0;
        let triH = 0;

        const targetNames = {
            'hypotenuse': { name: '斜邊', color: 'text-purple-400' },
            'opposite': { name: '對邊', color: 'text-blue-400' },
            'adjacent': { name: '鄰邊', color: 'text-pink-400' }
        };

        const questionTemplates = [
            "忍者貓需要溜滑梯！點擊<span class='{color} font-black text-3xl'>【{target}】</span>！",
            "敵人出現！對準<span class='{color} font-black text-3xl'>【{target}】</span>發射飛鏢！",
            "防禦！請在<span class='{color} font-black text-3xl'>【{target}】</span>架起護盾！",
            "尋找破綻！貓咪的<span class='{color} font-black text-3xl'>【{target}】</span>在哪裡？"
        ];

        // --- 新增：動態生成三角形功能 ---
        function createArcPath(centerX, centerY, v1x, v1y, v2x, v2y, r) {
            let len1 = Math.sqrt(v1x*v1x + v1y*v1y);
            let len2 = Math.sqrt(v2x*v2x + v2y*v2y);
            let nx1 = v1x/len1, ny1 = v1y/len1;
            let nx2 = v2x/len2, ny2 = v2y/len2;
            let p1x = centerX + nx1 * r; let p1y = centerY + ny1 * r;
            let p2x = centerX + nx2 * r; let p2y = centerY + ny2 * r;
            let angle1 = Math.atan2(ny1, nx1);
            let angle2 = Math.atan2(ny2, nx2);
            let diff = angle2 - angle1;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            let sweepFlag = diff > 0 ? 1 : 0;
            let largeArcFlag = Math.abs(diff) > Math.PI ? 1 : 0;
            return `M ${centerX} ${centerY} L ${p1x} ${p1y} A ${r} ${r} 0 ${largeArcFlag} ${sweepFlag} ${p2x} ${p2y} Z`;
        }

        function generateTriangle() {
            // 隨機產生寬高 (100 ~ 240)，確保在 SVG 內不會出界且比例多樣
            triW = Math.floor(Math.random() * 140) + 100;
            triH = Math.floor(Math.random() * 140) + 100;

            ptA = { x: -triW/2, y: -triH/2 }; // 直角固定在左上角 (相對座標)
            ptB = { x: triW/2, y: -triH/2 };  // 銳角 1
            ptC = { x: -triW/2, y: triH/2 };  // 銳角 2

            // 更新三角形外觀
            document.getElementById('triFill').setAttribute('points', `${ptA.x},${ptA.y} ${ptB.x},${ptB.y} ${ptC.x},${ptC.y}`);
            
            // 更新直角標記
            let rectSize = 30;
            document.getElementById('rightAngle').setAttribute('d', `M ${ptA.x} ${ptA.y+rectSize} L ${ptA.x+rectSize} ${ptA.y+rectSize} L ${ptA.x+rectSize} ${ptA.y}`);

            // 更新互動區與邊線
            const updateLine = (id, p1, p2) => {
                ['hit-', 'line-'].forEach(prefix => {
                    const el = document.getElementById(prefix + id);
                    el.setAttribute('x1', p1.x); el.setAttribute('y1', p1.y);
                    el.setAttribute('x2', p2.x); el.setAttribute('y2', p2.y);
                });
            };
            updateLine('AB', ptA, ptB);
            updateLine('AC', ptA, ptC);
            updateLine('BC', ptB, ptC);

            // 更新扇形標記 (Arcs)
            document.getElementById('arcB').setAttribute('d', createArcPath(ptB.x, ptB.y, -triW, 0, -triW, triH, 35));
            document.getElementById('arcC').setAttribute('d', createArcPath(ptC.x, ptC.y, 0, -triH, triW, -triH, 35));
        }

        // --- 新增：自定義貓咪位置及過渡動畫 ---
        function moveCat(newPos, isManualClick = false, isInit = false) {
            if (isAnimating && !isInit) return; // 鎖定狀態下不能亂動貓咪
            if (activeVertex === newPos) return;

            catPosName = newPos;
            activeVertex = newPos;
            const arcB = document.getElementById('arcB');
            const arcC = document.getElementById('arcC');
            const catEl = document.getElementById('ninjaCat');

            if (catPosName === 'B') {
                arcB.style.display = 'block'; arcC.style.display = 'none';
                let L_BC = Math.sqrt(triW*triW + triH*triH);
                let dirX = (-triW)/triW + (-triW)/L_BC;
                let dirY = (0)/triW + (triH)/L_BC;
                let len = Math.sqrt(dirX*dirX + dirY*dirY);
                catX = ptB.x + (dirX/len) * 35; 
                catY = ptB.y + (dirY/len) * 35;
            } else {
                arcB.style.display = 'none'; arcC.style.display = 'block';
                let L_CB = Math.sqrt(triW*triW + triH*triH);
                let dirX = (0)/triH + (triW)/L_CB;
                let dirY = (-triH)/triH + (-triH)/L_CB;
                let len = Math.sqrt(dirX*dirX + dirY*dirY);
                catX = ptC.x + (dirX/len) * 35; 
                catY = ptC.y + (dirY/len) * 35;
            }

            // 讓貓咪的 x/y 維持 0，純粹靠 CSS transform 做平滑動畫
            catEl.setAttribute('x', 0);
            catEl.setAttribute('y', 0);
            catEl.style.transform = `translate(${catX}px, ${catY}px) scale(${currentFlip}, 1) rotate(${-currentRotation}deg)`;
            
            // 更新文字顏色提示當前活動角
            document.getElementById('label-B').setAttribute('fill', catPosName === 'B' ? '#FBBF24' : '#94A3B8');
            document.getElementById('label-C').setAttribute('fill', catPosName === 'C' ? '#FBBF24' : '#94A3B8');

            // 如果是在玩遊戲中手動切換貓咪，我們自動幫他重置畫面(取消箭頭等)
            if (isManualClick) {
                clearFlashes();
                document.getElementById('feedbackLayer').innerHTML = '';
            }
        }

        // --- 新增：視覺化教學回饋 (畫箭頭或強調線) ---
        function showVisualFeedback(target) {
            const layer = document.getElementById('feedbackLayer');
            let fbSVG = ''; 

            const midPoint = (p1, p2) => ({ x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 });
            const midBC = midPoint(ptB, ptC);
            const midAC = midPoint(ptA, ptC);
            const midAB = midPoint(ptA, ptB);

            let textX = 0, textY = 0, textStr = "", textColor = "";

            if (target === 'hypotenuse') {
                // 斜邊：從直角發出虛線箭頭指向斜邊中點
                fbSVG += `<line x1="${ptA.x}" y1="${ptA.y}" x2="${midBC.x}" y2="${midBC.y}" stroke="#A855F7" stroke-width="4" stroke-dasharray="8,8" marker-end="url(#arrow-hypotenuse)" class="fade-in-element pointer-events-none" />`;
                textX = 35; 
                textY = 35;
                textStr = "直角對向 (斜邊)"; 
                textColor = "#A855F7";
            } else if (target === 'opposite') {
                // 對邊：從參考角(貓咪)發射虛線箭頭指向對邊中點
                textColor = "#3B82F6";
                textStr = "貓對面的邊 (對邊)";
                let endX, endY;
                if (activeVertex === 'B') {
                    endX = midAC.x;
                    endY = midAC.y;
                    fbSVG += `<line x1="${ptB.x}" y1="${ptB.y}" x2="${endX}" y2="${endY}" stroke="${textColor}" stroke-width="4" stroke-dasharray="8,8" marker-end="url(#arrow-opposite)" class="fade-in-element pointer-events-none" />`;
                    textX = endX - 40; 
                    textY = endY;
                } else {
                    endX = midAB.x;
                    endY = midAB.y;
                    fbSVG += `<line x1="${ptC.x}" y1="${ptC.y}" x2="${endX}" y2="${endY}" stroke="${textColor}" stroke-width="4" stroke-dasharray="8,8" marker-end="url(#arrow-opposite)" class="fade-in-element pointer-events-none" />`;
                    textX = endX; 
                    textY = endY - 35;
                }

                // 加入忍者貓發射飛鏢特效動畫
                fbSVG += `
                <g class="pointer-events-none">
                    <!-- 飛鏢位移動畫：從貓咪位置丟到對邊中點 -->
                    <animateTransform attributeName="transform" type="translate" from="${catX} ${catY}" to="${endX} ${endY}" begin="0s" dur="0.4s" fill="freeze" />
                    <g>
                        <!-- 飛鏢旋轉動畫 -->
                        <animateTransform attributeName="transform" type="rotate" from="0" to="720" begin="0s" dur="0.4s" fill="freeze" />
                        <!-- 四角飛鏢形狀 -->
                        <path d="M 0 -15 L 3 -3 L 15 0 L 3 3 L 0 15 L -3 3 L -15 0 L -3 -3 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1" />
                    </g>
                    <!-- 動畫結束後淡出 -->
                    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="0.6s" fill="freeze" />
                </g>`;
                
            } else if (target === 'adjacent') {
                // 鄰邊：用粗的半透明粉紅線覆蓋在夾住直角與參考角的邊上
                textColor = "#EC4899";
                textStr = "貓和直角共同夾住 (鄰邊)";
                if (activeVertex === 'B') {
                    fbSVG += `<line x1="${ptA.x}" y1="${ptA.y}" x2="${ptB.x}" y2="${ptB.y}" stroke="${textColor}" stroke-width="16" opacity="0.6" stroke-linecap="round" class="fade-in-element pointer-events-none" />`;
                    textX = midAB.x; 
                    textY = midAB.y + 35;
                } else {
                    fbSVG += `<line x1="${ptA.x}" y1="${ptA.y}" x2="${ptC.x}" y2="${ptC.y}" stroke="${textColor}" stroke-width="16" opacity="0.6" stroke-linecap="round" class="fade-in-element pointer-events-none" />`;
                    textX = midAC.x + 35; 
                    textY = midAC.y;
                }
            }

            // 繪製反向旋轉的文字，確保不管三角形怎麼翻轉文字都是水平好閱讀的
            let counterTransform = `translate(${textX}, ${textY}) scale(${currentFlip}, 1) rotate(${-currentRotation}) translate(${-textX}, ${-textY})`;
            // 使用 stroke 做描邊處理，讓文字在任何顏色的三角形上都清晰可見
            fbSVG += `<text x="${textX}" y="${textY}" fill="${textColor}" font-size="16" font-weight="900" text-anchor="middle" dominant-baseline="central" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" paint-order="stroke" transform="${counterTransform}" class="fade-in-element pointer-events-none">${textStr}</text>`;

            layer.innerHTML = fbSVG;
        }

        function startGame() {
            document.getElementById('startOverlay').style.display = 'none';
            document.getElementById('gameOverOverlay').style.display = 'none';
            score = 0;
            level = 1;
            stats = { hypotenuse: 0, opposite: 0, adjacent: 0 };
            statTotal = { hypotenuse: 0, opposite: 0, adjacent: 0 };
            updateScore();
            nextLevel();
        }

        function nextLevel() {
            isAnimating = false;
            hasWronged = false;
            isTwistPhase = false;
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('feedbackMsg').innerText = " ";
            
            // 移除之前的特效與視覺回饋
            clearFlashes();
            document.getElementById('feedbackLayer').innerHTML = '';

            // 1. 動態生成新形狀的三角形
            generateTriangle();

            // 將感應區追蹤至 B, C 節點
            document.getElementById('hit-vertex-B').setAttribute('cx', ptB.x);
            document.getElementById('hit-vertex-B').setAttribute('cy', ptB.y);
            document.getElementById('hit-vertex-C').setAttribute('cx', ptC.x);
            document.getElementById('hit-vertex-C').setAttribute('cy', ptC.y);

            // 2. 依關卡決定旋轉與翻轉 (漸進難度)
            // 第 1-3 關：無旋轉無翻轉；第 4-6 關：有旋轉不翻轉；第 7-10 關：旋轉＋翻轉
            if (level <= 3) {
                currentRotation = 0;
                currentFlip = 1;
            } else if (level <= 6) {
                currentRotation = Math.floor(Math.random() * 36) * 10;
                currentFlip = 1;
            } else {
                currentRotation = Math.floor(Math.random() * 36) * 10;
                currentFlip = Math.random() > 0.5 ? 1 : -1;
            }
            const triangleGroup = document.getElementById('triangleGroup');
            triangleGroup.setAttribute('transform', `translate(200, 200) rotate(${currentRotation}) scale(${currentFlip}, 1)`);

            // 3. 決定貓咪位置與扇形顯示 (B 點或 C 點)
            activeVertex = ''; // 先歸零讓 moveCat 強制更新
            catPosName = ''; // 先歸零讓 moveCat 強制更新
            moveCat(Math.random() > 0.5 ? 'B' : 'C', false, true); // true 代表是初始化，不顯示動畫

            // 更新頂點標籤位置與反向旋轉，確保文字始終正立清晰可讀
            const LOFF = 24;
            const labelData = [
                { id: 'label-A', x: ptA.x - LOFF, y: ptA.y - LOFF },
                { id: 'label-B', x: ptB.x + LOFF, y: ptB.y - LOFF },
                { id: 'label-C', x: ptC.x - LOFF, y: ptC.y + LOFF },
            ];
            labelData.forEach(({ id, x, y }) => {
                const el = document.getElementById(id);
                el.setAttribute('x', x);
                el.setAttribute('y', y);
                el.setAttribute('transform', `translate(${x}, ${y}) scale(${currentFlip}, 1) rotate(${-currentRotation}) translate(${-x}, ${-y})`);
            });

            // 更新難度階段提示
            const phaseText = level <= 3 ? '🔰基礎' : level <= 6 ? '⚔️進階' : '🔥高難';
            document.getElementById('phaseDisplay').innerText = phaseText;

            // 4. 決定題目 (前三關只出斜邊和對邊，配合難度曲線)
            const availableTargets = level <= 3 ? ['hypotenuse', 'opposite'] : ['hypotenuse', 'opposite', 'adjacent'];
            
            // 改為「平均分佈」邏輯：優先選擇目前出現次數最少的題目類型
            let minCount = Infinity;
            let candidates = [];
            availableTargets.forEach(t => {
                if (statTotal[t] < minCount) {
                    minCount = statTotal[t];
                    candidates = [t];
                } else if (statTotal[t] === minCount) {
                    candidates.push(t);
                }
            });
            currentTarget = candidates[Math.floor(Math.random() * candidates.length)];
            
            statTotal[currentTarget]++;

            // 5. 更新介面文字
            const qTemplate = questionTemplates[Math.floor(Math.random() * questionTemplates.length)];
            const targetInfo = targetNames[currentTarget];
            let qText = qTemplate.replace('{target}', targetInfo.name).replace('{color}', targetInfo.color);
            document.getElementById('taskQuestion').innerHTML = qText;
            
            // 讓題目有跳出的感覺
            const qEl = document.getElementById('taskQuestion');
            qEl.classList.remove('pop');
            void qEl.offsetWidth; // 觸發重繪
            qEl.classList.add('pop');
        }

        function checkAnswer(clickedEdge) {
            if (isAnimating) return; // 動畫播放中禁止點擊

            let isCorrect = false;
            let correctEdgeId = '';

            // 邏輯判斷核心
            // A 是直角。
            // BC 線永遠是斜邊 (Hypotenuse)
            // 如果貓在 B: 對邊是 AC，鄰邊是 AB
            // 如果貓在 C: 對邊是 AB，鄰邊是 AC

            if (currentTarget === 'hypotenuse') {
                correctEdgeId = 'BC';
                if (clickedEdge === 'BC') isCorrect = true;
            } else if (currentTarget === 'opposite') {
                if (activeVertex === 'B') {
                    correctEdgeId = 'AC';
                    if (clickedEdge === 'AC') isCorrect = true;
                } else if (activeVertex === 'C') {
                    correctEdgeId = 'AB';
                    if (clickedEdge === 'AB') isCorrect = true;
                }
            } else if (currentTarget === 'adjacent') {
                if (activeVertex === 'B') {
                    correctEdgeId = 'AB';
                    if (clickedEdge === 'AB') isCorrect = true;
                } else if (activeVertex === 'C') {
                    correctEdgeId = 'AC';
                    if (clickedEdge === 'AC') isCorrect = true;
                }
            }

            isAnimating = true;
            clearFlashes();

            const lineEl = document.getElementById('line-' + clickedEdge);
            const correctLineEl = document.getElementById('line-' + correctEdgeId);

            // 觸發視覺化回饋教學 (畫出箭頭或線條與文字標籤，包含飛鏢動畫)
            showVisualFeedback(currentTarget);

            // 準備教學回饋文字
            let explanation = "";
            if (currentTarget === 'hypotenuse') {
                explanation = "「斜邊」永遠在直角的正對面，也是最長的邊。";
            } else if (currentTarget === 'opposite') {
                explanation = "「對邊」是貓咪(參考角)正前方，貓對面的那條邊。";
            } else if (currentTarget === 'adjacent') {
                explanation = "「鄰邊」是貓咪旁邊，與直角共同夾住的那面短牆。";
            }

            // 如果是在突發視角變更後，補充說明相對性
            if (isTwistPhase) {
                explanation = `小提示：參考角換了，${targetNames[currentTarget].name}位置也跟著變換喔！ ` + explanation;
            }

            if (isCorrect) {
                // 答對處理
                lineEl.classList.add(`correct-flash-${currentTarget}`);
                if (!hasWronged && !isTwistPhase) stats[currentTarget]++;
                
                // 檢查是否能觸發「視角突發環節」(只適用於對邊/鄰邊，約有 40% 機率在第 3 關之後觸發)
                if (level >= 3 && !isTwistPhase && (currentTarget === 'opposite' || currentTarget === 'adjacent') && Math.random() < 0.4) {
                    isTwistPhase = true;
                    showMessage(`答對了！🎯 但等等... 貓咪跳陣地了！`, "text-emerald-400");
                    score += 10;
                    updateScore();
                    
                    document.getElementById('taskQuestion').classList.remove('pop');
                    // 延遲一段時間讓學生看到對的畫面，接著突發切換
                    setTimeout(() => {
                        const newPos = (catPosName === 'B') ? 'C' : 'B';
                        
                        isAnimating = false; // 先釋放鎖定，否則 moveCat 會被擋下
                        
                        // 移動貓咪，自動重置線條
                        moveCat(newPos, true);
                        
                        hasWronged = false;  // 給學生新機會

                        // 更新題目提示
                        const targetInfo = targetNames[currentTarget];
                        document.getElementById('taskQuestion').innerHTML = `🔄 突發！視角變更！<br>現在新的<span class='${targetInfo.color} font-black text-3xl'>【${targetInfo.name}】</span>在哪？`;
                        showMessage(`貓咪移動了！快找出新的邊界！`, "text-yellow-400");
                        
                        void document.getElementById('taskQuestion').offsetWidth;
                        document.getElementById('taskQuestion').classList.add('pop');
                        document.getElementById('gameContainer').classList.add('pop');
                        setTimeout(() => document.getElementById('gameContainer').classList.remove('pop'), 300);
                    }, 1800);

                    return; // 中斷這裡，不進入換關邏輯
                }

                showMessage(`答對了！🎯 ${explanation}`, "text-emerald-400");
                score += 10;
                
                if (level >= MAX_LEVEL) {
                    // 達成 10 關，遊戲結束
                    updateScore();
                    setTimeout(() => {
                        document.getElementById('finalScore').innerText = score;
                        document.getElementById('statsDisplay').innerHTML = `
                            <p class="text-slate-400 text-sm mb-3 text-center">各類型答對統計</p>
                            <div class="grid grid-cols-3 gap-2 text-center">
                                <div class="bg-slate-800 rounded-xl p-2"><div class="text-purple-400 font-black text-2xl">${stats.hypotenuse}<span class="text-slate-500 text-sm">/${statTotal.hypotenuse}</span></div><div class="text-xs text-slate-400 mt-1">斜邊</div></div>
                                <div class="bg-slate-800 rounded-xl p-2"><div class="text-blue-400 font-black text-2xl">${stats.opposite}<span class="text-slate-500 text-sm">/${statTotal.opposite}</span></div><div class="text-xs text-slate-400 mt-1">對邊</div></div>
                                <div class="bg-slate-800 rounded-xl p-2"><div class="text-pink-400 font-black text-2xl">${stats.adjacent}<span class="text-slate-500 text-sm">/${statTotal.adjacent}</span></div><div class="text-xs text-slate-400 mt-1">鄰邊</div></div>
                            </div>`;
                        document.getElementById('gameOverOverlay').style.display = 'flex';
                    }, 2500); // 延長等待時間讓學生看完解說
                } else {
                    // 進入下一關
                    level++;
                    updateScore();
                    setTimeout(() => {
                        nextLevel();
                    }, 2500); // 延長等待時間讓學生看完解說
                }
            } else {
                // 答錯處理
                lineEl.classList.add('wrong-flash');
                hasWronged = true;
                
                showMessage(`哎呀！找錯了！${explanation}再找找看！`, "text-red-400");
                document.getElementById('gameContainer').classList.add('shake');
                
                score = Math.max(0, score - 5);
                updateScore();

                setTimeout(() => {
                    document.getElementById('gameContainer').classList.remove('shake');
                    // 答錯不換關，過段時間後移除紅色錯誤邊讓玩家再點一次
                    // 但保留視覺化回饋 (箭頭/線條) 和說明文字讓學生思考
                    setTimeout(() => {
                        clearFlashes(); 
                        isAnimating = false;
                    }, 1000);
                }, 500);
            }
        }

        function clearFlashes() {
            const lines = ['line-AB', 'line-AC', 'line-BC'];
            lines.forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('correct-flash-hypotenuse', 'correct-flash-opposite', 'correct-flash-adjacent', 'wrong-flash');
            });
        }

        function showMessage(msg, colorClass) {
            const fb = document.getElementById('feedbackMsg');
            fb.innerText = msg;
            // 把原本固定的 h-5 改成 min-h-[2.5rem]，避免解說文太長被切斷
            fb.className = `text-sm min-h-[2.5rem] font-bold transition-colors duration-300 ${colorClass}`;
        }

        function updateScore() {
            document.getElementById('scoreDisplay').innerText = score;
            const scoreEl = document.getElementById('scoreDisplay');
            scoreEl.classList.remove('pop');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('pop');
        }
    </script>
